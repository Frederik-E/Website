# Dein Lebenslauf. Er steht auf /cv/, als PDF zum Herunterladen und in
# Kurzform auf der Startseite.
#
# Ganz oben das Profil: ein paar Saetze in der Ich-Form. Es steht auf der
# Startseite unter der grossen Zeile und im Lebenslauf als erster Abschnitt. Eine Leerzeile beginnt einen neuen Absatz.
#
# Danach die Abschnitte, in der Reihenfolge, in der sie hier stehen. Es gibt
# zwei Arten von Eintraegen:
#   Station: titel, organisation, ort, von, bis, punkte
#   Liste:   bereich, liste
# Zeitangaben im Format JJJJ-MM. "bis" leer lassen bedeutet "heute".
# Keine Adresse, keine Telefonnummer, kein Geburtsdatum.
#
# "startseite: true" zeigt einen Abschnitt auch auf der Startseite. Dort
# stehen nur Titel, Organisation und Zeitraum, die Stichpunkte nicht.

